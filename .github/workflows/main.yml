name: Update Current Thought Stream

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

env:
  TZ: "Asia/Ho_Chi_Minh"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download manuals files directly
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
          mkdir -p manuals/nguyen-q-huy
          # Dùng header application/vnd.github.v3.raw để lấy nội dung file thay vì JSON
          curl -L -H "Authorization: Bearer $GH_API_TOKEN" \
            -H "Accept: application/vnd.github.v3.raw" \
            https://api.github.com/repos/nguyen-q-huy/manuals/contents/nguyen-q-huy/TEMPLATE.md \
            -o manuals/nguyen-q-huy/TEMPLATE.md
          curl -L -H "Authorization: Bearer $GH_API_TOKEN" \
            -H "Accept: application/vnd.github.v3.raw" \
            https://api.github.com/repos/nguyen-q-huy/manuals/contents/nguyen-q-huy/update.py \
            -o manuals/nguyen-q-huy/update.py

      - name: Sync template and updater
        run: |
          cp manuals/nguyen-q-huy/TEMPLATE.md TEMPLATE.md
          mkdir -p scripts
          cp manuals/nguyen-q-huy/update.py scripts/update.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update stream block in README
        env:
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
          DEFAULT_GITHUB_USERNAME: ${{ secrets.DEFAULT_GITHUB_USERNAME }}
          MAX_PUBLIC_COMMITS: ${{ secrets.MAX_PUBLIC_COMMITS }}
          GITHUB_API_BASE: ${{ secrets.GITHUB_API_BASE }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WEATHER_API: ${{ secrets.WEATHER_API }}
          WEATHER_RSS_URL: ${{ secrets.WEATHER_RSS_URL }}
          TZ: ${{ secrets.TZ }}
          WEATHER_LAT: ${{ secrets.WEATHER_LAT }}
          WEATHER_LON: ${{ secrets.WEATHER_LON }}
          WEATHER_LABEL: ${{ secrets.WEATHER_LABEL }}
          WEATHER_TIMEZONE: ${{ secrets.WEATHER_TIMEZONE }}
          HOLIDAY_CALENDAR_ID: ${{ secrets.HOLIDAY_CALENDAR_ID }}
          HOLIDAY_API_BASE: ${{ secrets.HOLIDAY_API_BASE }}
          HOLIDAY_API_KEY: ${{ secrets.HOLIDAY_API_KEY }}
        run: python scripts/update.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git add README.md
          git commit -m "chore: update current thought stream $(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d')"
          git push origin HEAD:${{ github.ref_name }}
