name: Update Current Thought Stream

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

env:
  TZ: "Asia/Ho_Chi_Minh"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Checkout manuals source
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          rm -rf manuals
          git clone --depth 1 --branch master "https://x-access-token:${GH_TOKEN}@github.com/nguyen-q-huy/manuals.git" manuals
          git config --global --add safe.directory "$GITHUB_WORKSPACE/manuals"

      - name: Sync template and updater from manuals
        run: |
          cp manuals/nguyen-q-huy/TEMPLATE.md TEMPLATE.md
          mkdir -p scripts
          cp manuals/nguyen-q-huy/update.py scripts/update.py

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - name: Update stream block in README
        env:
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
          DEFAULT_GITHUB_USERNAME: ${{ secrets.DEFAULT_GITHUB_USERNAME }}
          MAX_PUBLIC_COMMITS: ${{ secrets.MAX_PUBLIC_COMMITS }}
          GITHUB_API_BASE: ${{ secrets.GITHUB_API_BASE }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WEATHER_API: ${{ secrets.WEATHER_API }}
          WEATHER_RSS_URL: ${{ secrets.WEATHER_RSS_URL }}
          TZ: ${{ secrets.TZ }}
          WEATHER_LAT: ${{ secrets.WEATHER_LAT }}
          WEATHER_LON: ${{ secrets.WEATHER_LON }}
          WEATHER_LABEL: ${{ secrets.WEATHER_LABEL }}
          WEATHER_TIMEZONE: ${{ secrets.WEATHER_TIMEZONE }}
          HOLIDAY_CALENDAR_ID: ${{ secrets.HOLIDAY_CALENDAR_ID }}
          HOLIDAY_API_BASE: ${{ secrets.HOLIDAY_API_BASE }}
          HOLIDAY_API_KEY: ${{ secrets.HOLIDAY_API_KEY }}
        run: python scripts/update.py

      - name: Commit and push changes
        run: |
          git config user.name "update"
          git config user.email "update@github"
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add README.md
          git commit -m "chore: update current thought stream $(TZ='Asia/Ho_Chi_Minh' date +'%Y-%m-%d')"
          git pull --rebase origin publish
          git push
